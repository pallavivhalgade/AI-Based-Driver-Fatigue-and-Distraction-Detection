name: driver_monitor_app
description: "AI Driver Fatigue Detection App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  sms_sender: ^1.0.7
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  camera: ^0.12.0+1
  google_mlkit_face_detection: ^0.13.2
  flutter_tts: ^4.2.5
  tflite_flutter: ^0.12.1
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/driver_fatigue_model.tflite
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"